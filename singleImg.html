<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Single Image Bulb</title>

    <style>
      /* Body */
      body {
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: black;
        transition: 0.5s;
        font-family: Arial;
      }

      /* Background when ON */
      .lightOn {
        background: radial-gradient(circle, #fff3a0, #ffcc00, #000000);
      }

      /* Container */
      .container {
        text-align: center;
      }

      /* Image fixed size */
      #myImg {
        width: 180px;
        height: 250px;
        object-fit: contain;
        transition: 0.4s;
      }

      /* Glow effect */
      .glow {
        filter: drop-shadow(0 0 20px yellow) drop-shadow(0 0 40px orange)
          drop-shadow(0 0 60px gold) brightness(1.3);
      }

      /* Buttons */
      button {
        padding: 12px 25px;
        margin: 10px;
        border: none;
        border-radius: 25px;
        font-size: 16px;
        cursor: pointer;
        background: linear-gradient(45deg, #444, #222);
        color: white;
        transition: 0.3s;
      }

      button:hover {
        transform: scale(1.1);
        box-shadow: 0 0 15px yellow;
      }
    </style>
  </head>

  <body id="body">
    <div class="container">
      <button onclick="turnOn()">Turn ON</button>

      <br />

      <!-- SINGLE IMAGE -->
      <img id="myImg" src="./bulboff-removebg-preview.png" />

      <br />

      <button onclick="turnOff()">Turn OFF</button>
    </div>

    <script>
      function turnOn() {
        document.getElementById("myImg").classList.add("glow");
        document.getElementById("body").classList.add("lightOn");
      }

      function turnOff() {
        document.getElementById("myImg").classList.remove("glow");
        document.getElementById("body").classList.remove("lightOn");
      }
    </script>
  </body>
</html>
